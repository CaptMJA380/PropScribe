{% extends 'base.html' %}

{% block content %}
<div style="padding:3.5rem 0;text-align:center;">
    <div style="display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:1.25rem;">

    <div style="font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:600;color:var(--text_p);line-height:1.2;letter-spacing:-.02em;margin-bottom:1rem;">

        Upgrade to Pro →

</div>
{% endblock %}
