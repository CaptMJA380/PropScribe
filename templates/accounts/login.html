{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto; text-align: center;">
    <h2 style="font-family:'Cormorant Garamond',serif; color:#F2EDE0; font-size:2rem; margin-bottom: 2rem;">Welcome Back</h2>
    <form method="POST" action="{% url 'accounts:login' %}" style="display:flex; flex-direction:column; gap:1.5rem; text-align: left;">
        {% csrf_token %}
        <div>
            <label style="color:#9A9AAE; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; display:block; margin-bottom:8px;">Email</label>
            <input type="email" name="email" required style="width:100%; box-sizing:border-box; background:#161625; border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:#F2EDE0; font-size:14px; padding:0.8rem 1rem; outline:none;">
        </div>
        <div>
            <label style="color:#9A9AAE; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; display:block; margin-bottom:8px;">Password</label>
            <input type="password" name="password" required style="width:100%; box-sizing:border-box; background:#161625; border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:#F2EDE0; font-size:14px; padding:0.8rem 1rem; outline:none;">
        </div>
        <button type="submit" class="btn-primary" style="margin-top: 1rem;">Sign In</button>
    </form>
    <div style="margin-top: 2rem; color: #9A9AAE; font-size: 13px;">
        Don't have an account? <a href="{% url 'accounts:register' %}" style="color: #C9A348;">Sign Up</a>
    </div>
</div>
{% endblock %}
