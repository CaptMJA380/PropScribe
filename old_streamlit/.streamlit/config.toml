# .streamlit/config.toml

[server]
# REQUIRED: enables local file serving from .streamlit/static/
enableStaticServing = true
runOnSave = false
maxUploadSize = 10

[browser]
gatherUsageStats = false

# Theme is controlled dynamically via CSS injected by Python.
# We keep font only — no background/text hardcoding so dark/light CSS works.
[theme]
primaryColor = "#C9A348"
font = "sans serif"